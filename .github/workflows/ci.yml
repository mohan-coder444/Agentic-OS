name: CI

# Runs on every push to main and on PRs. Verifies deps install, the frontend
# builds, and every service Dockerfile still produces a valid image. No deploy
# step: this catches broken builds before they land on main, and the same
# workflow is the seed for a future Tier 3 deploy (add push-to-ECR later).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so PR pushes don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        env:
          # Vite reads VITE_* at build time. CI uses safe placeholders so the
          # build doesn't fail on missing env, and never bakes real keys in.
          VITE_API_URL: http://localhost:8000
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_APP_ID: ci-placeholder
        run: npm run build

  backend-install:
    name: Backend deps (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            path: backend/gateway
          - service: auth
            path: backend/services/auth
          - service: chat
            path: backend/services/chat
          - service: agent
            path: backend/services/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.path }}
        run: npm ci
      - name: Syntax check entry point
        working-directory: ${{ matrix.path }}
        run: node --check index.js

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: backend-install
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: backend/gateway/Dockerfile
          - service: auth
            dockerfile: backend/services/auth/Dockerfile
          - service: chat
            dockerfile: backend/services/chat/Dockerfile
          - service: agent
            dockerfile: backend/services/agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          # Context matches docker-compose.yml: ./backend, so Dockerfiles can
          # COPY services/<name>/. and shared/ from a single build root.
          context: ./backend
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          tags: agenticos-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
