version: "3.8"
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  gateway:
    build:
      context: ./backend
      dockerfile: ./gateway/Dockerfile
    ports:
      - "8000:8000"
    env_file: ./backend/gateway/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth:8001
      - CHAT_SERVICE_URL=http://chat:8002
      - AGENT_SERVICE_URL=http://agent:8003
      # Comma-separated CORS allowlist. Default keeps local dev working; add the
      # deployed frontend origin to serve both at once, e.g.
      #   FRONTEND_URLS=http://localhost:5173,https://your-app.vercel.app
      - FRONTEND_URLS=${FRONTEND_URLS:-http://localhost:5173}
    depends_on:
      - redis
      - auth
      - chat
      - agent
    restart: unless-stopped

  auth:
    build:
      context: ./backend
      dockerfile: ./services/auth/Dockerfile
    ports:
      - "8001:8001"
    env_file: ./backend/services/auth/.env
    volumes:
      # Firebase service account key is mounted at runtime, never COPYed into the
      # image (backend/.dockerignore excludes it). Keeping it out of image layers
      # matters because a baked-in secret survives even a later `rm` and would
      # ship to anyone who pulls the image. Read-only: the app only reads it.
      - ./backend/services/auth/serviceAccountKey.json:/app/serviceAccountKey.json:ro
    environment:
      - REDIS_URL=redis://redis:6379
      # Set true ONLY when the frontend is on a different site than the API
      # (e.g. vercel.app -> trycloudflare.com). Emits sameSite=none; Secure,
      # which browsers require for cross-site cookies but which also demands
      # HTTPS on both ends. Leave false for localhost development.
      - CROSS_SITE_COOKIES=${CROSS_SITE_COOKIES:-false}
    depends_on:
      - redis
    restart: unless-stopped

  chat:
    build:
      context: ./backend
      dockerfile: ./services/chat/Dockerfile
    ports:
      - "8002:8002"
    env_file: ./backend/services/chat/.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  agent:
    build:
      context: ./backend
      dockerfile: ./services/agent/Dockerfile
    ports:
      - "8003:8003"
    env_file: ./backend/services/agent/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - CHAT_SERVICE_URL=http://chat:8002
    depends_on:
      - redis
      - chat
    restart: unless-stopped

volumes:
  redis_data:
